{% extends "layout.html" %}
{% block nav %}
<li class="nav-item"><a class="nav-link" href="/auth/register">Register</a></li>
{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-dark text-white shadow text-center">
            <div class="card-header bg-secondary">Registration</div>
            <div class="card-body">
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="POST" action="/auth/register">
                    <div class="mb-3">
                        <label>Handle</label>
                        <input type="text" name="identity" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>Passkey</label>
                        <input type="password" name="password" class="form-control bg-dark text-white" required>
                    </div>
                    <div class="mb-3">
                        <label>Profile Type</label>
                        <select name="profile" class="form-control bg-dark text-white" required>
                            <option value="client">Client</option>
                            <option value="guide">Guide</option>
                            
                        </select>
                    </div>
                    <button class="btn btn-success w-100">Register</button>
                </form>
                <div class="text-center mt-3">
                     <a href="/auth/login">back to Authentication</a>
                     </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
