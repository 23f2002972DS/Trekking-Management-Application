<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekMap</title>
    <!-- Vapor theme/dark neon -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/vapor/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container"> 
            <a class="navbar-brand" href="#">TrekMap</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    {% block nav %}{% endblock %}
                    {% if session.get('profile') %}
                    <li class="nav-item"><a class="nav-link text-danger" href="/client/logout">Logout</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
